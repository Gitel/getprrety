name: verify and deploy OVH Docker
on:
  push:
    branches: [main, migration/ovh-docker]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-getpretty
  cancel-in-progress: false
jobs:
  target-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install restricted deployment key
        env:
          KEY: ${{ secrets.OVH_DEPLOY_KEY || secrets.DO_SSH_KEY }}
        run: |
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          cp .github/ovh_known_hosts ~/.ssh/known_hosts
      - name: Verify OVH access and existing application
        run: bash deploy/ovh/ssh-command.sh status
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate API
        run: |
          npm ci --ignore-scripts --prefix server
          npm test --prefix server -- --runInBand
      - name: Build web application
        env:
          VITE_API_URL: https://getpretty.app
          VITE_CONSENT_VERSION: ${{ secrets.EXPO_PUBLIC_CONSENT_VERSION }}
          VITE_TERMS_URL: ${{ secrets.EXPO_PUBLIC_TERMS_URL }}
          VITE_PRIVACY_URL: ${{ secrets.EXPO_PUBLIC_PRIVACY_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          npm ci --legacy-peer-deps
          npm test -- --runInBand
          npm run build
      - name: Build exact commit
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f deploy/ovh/Dockerfile -t botech/getpretty:${{ github.sha }} .
      - name: Package release
        run: |
          mkdir release
          tar -czf release/web.tar.gz -C dist .
          git branch ovh-release "${{ github.sha }}"
          git bundle create release/repository.bundle ovh-release
          docker save botech/getpretty:${{ github.sha }} | gzip -1 > release/image.tar.gz
          printf '%s\n' "${{ github.sha }}" > release/commit
          tar -czf release.tar.gz -C release .
          openssl cms -encrypt -binary -aes-256-cbc -in release.tar.gz -outform DER -out release.cms deploy/ovh/recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: ovh-release
          path: release.cms
          retention-days: 3
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, target-access]
    runs-on: ubuntu-latest
    environment: ovh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ovh-release
      - name: Install deployment key
        env:
          KEY: ${{ secrets.OVH_DEPLOY_KEY || secrets.DO_SSH_KEY }}
        run: |
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          cp .github/ovh_known_hosts ~/.ssh/known_hosts
      - name: Deploy and verify target
        run: bash deploy/ovh/ssh-command.sh deploy "${{ github.sha }}" release.cms
