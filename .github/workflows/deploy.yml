name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # An unset secret expands to an empty string rather than failing, which turns
      # LEGAL_READY false and ships a build whose onboarding CTA is dead for every
      # visitor — with a green checkmark. The first signal today is users who can't
      # start the quiz. Fail here instead, before anything is built or uploaded.
      - name: Verify web build secrets
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CONSENT_VERSION: ${{ secrets.EXPO_PUBLIC_CONSENT_VERSION }}
          EXPO_PUBLIC_TERMS_URL: ${{ secrets.EXPO_PUBLIC_TERMS_URL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ secrets.EXPO_PUBLIC_PRIVACY_URL }}
        run: |
          set -euo pipefail
          missing=()
          for var in EXPO_PUBLIC_API_URL EXPO_PUBLIC_CONSENT_VERSION EXPO_PUBLIC_TERMS_URL EXPO_PUBLIC_PRIVACY_URL; do
            [ -n "${!var}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          # LEGAL_READY (src/lib/consent.js) requires https:// specifically, not just
          # a non-empty value.
          for var in EXPO_PUBLIC_TERMS_URL EXPO_PUBLIC_PRIVACY_URL; do
            case "${!var}" in
              https://*) ;;
              *) echo "::error::$var must start with https:// — LEGAL_READY rejects anything else"; exit 1 ;;
            esac
          done
          echo "All web build secrets present."

      - name: Build Expo web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CONSENT_VERSION: ${{ secrets.EXPO_PUBLIC_CONSENT_VERSION }}
          # Required for onboarding: without both policy links the consent gate
          # (LEGAL_READY) stays closed and the quiz CTA is disabled.
          EXPO_PUBLIC_TERMS_URL: ${{ secrets.EXPO_PUBLIC_TERMS_URL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ secrets.EXPO_PUBLIC_PRIVACY_URL }}
        run: npx expo export --platform web

      - name: Upload web build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: dist/
          target: /var/www/getprrety/

      - name: Deploy server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            # Name the command that actually failed. Until now a red deploy reported only
            # an exit code, so which of these steps died had to be inferred from how long
            # the job ran — which is why this workflow stayed broken for a month.
            trap 'echo "::error::Deploy failed at line ${LINENO}: ${BASH_COMMAND}"' ERR

            cd /var/www/getprrety/server
            git fetch origin main
            git reset --hard origin/main
            npm install
            pm2 restart server --update-env
            pm2 save

            echo "Deployed commit: $(git rev-parse HEAD)"

            # Poll the app directly instead of curling the public hostname once.
            # `pm2 restart` returns before the process is listening and index.js only
            # calls app.listen() after Mongo connects, so a single immediate request
            # raced startup. Going through nginx also made a routing problem look
            # identical to a dead app; 127.0.0.1 answers that question on its own.
            for attempt in $(seq 1 20); do
              if curl -sf --max-time 3 http://127.0.0.1:3001/health >/dev/null; then
                echo "Server healthy after ${attempt}s"
                exit 0
              fi
              sleep 1
            done

            echo "::error::Server did not answer /health on 127.0.0.1:3001 within 20s"
            pm2 logs server --lines 50 --nostream || true
            exit 1
